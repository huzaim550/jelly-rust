[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyplug"
version = "1.0.0"
description = "SDK for writing jellyfin-clone plugins in Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "jellyfin-clone contributors" }]
keywords = ["media", "server", "plugins", "jellyfin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Intentionally zero runtime dependencies. Plugins run in-process holding the
# GIL, so every transitive dependency is a stability liability. The SDK ships
# its own timeout-bounded HTTP client instead.
dependencies = []

[project.urls]
Homepage = "https://github.com/jellyfin-clone/jellyfin-clone"

[tool.setuptools]
packages = ["jellyplug"]